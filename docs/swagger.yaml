basePath: /api/v1
definitions:
  response.Error:
    properties:
      code:
        type: string
      message:
        type: string
    type: object
  response.Response:
    properties:
      data: {}
      errors:
        items:
          $ref: '#/definitions/response.Error'
        type: array
      status:
        type: boolean
    type: object
host: localhost:8080
info:
  contact:
    email: sholokhovdaniil@yandex.ru
    name: API Support
    url: https://t.me/sholokhov22
  description: API for interacting with feedback forms
  termsOfService: http://swagger.io/terms/
  title: Feedback form API
  version: "1.0"
paths:
  /form/{id}:
    get:
      consumes:
      - application/json
      parameters:
      - description: Form ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.Response'
      summary: Returns a specific user form by its ID
      tags:
      - forms
  /forms:
    get:
      consumes:
      - application/json
      description: Returns all available forms
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - BearerAuth: []
      summary: List feedback forms
      tags:
      - forms
securityDefinitions:
  BearerAuth:
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
