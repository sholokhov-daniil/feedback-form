version: "3.9"

services:
  traefik:
    image: traefik:v3.6
    command:
      - "--api.dashboard=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--log.level=DEBUG"
    ports:
      - "80:80"
      - "8081:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.dashboard.rule=Host(`localhost`) && (PathPrefix(`/api`) || PathPrefix(`/dashboard`))"
      - "traefik.http.routers.dashboard.service=api@internal"
      - "traefik.http.routers.dashboard.entrypoints=web"
    networks:
      - feedback-network

  feedback-api:
    build: .
    volumes:
      - .:/app
    command: ["air"]
    environment:
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
      - SERVER_PORT=${HOST_PORT}
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.feedback.rule=Host(`${HOST_NAME}`)"
      - "traefik.http.routers.feedback.entrypoints=web"
      - "traefik.http.services.feedback.loadbalancer.server.port=${HOST_PORT}"
    depends_on:
      - db
    networks:
      - feedback-network

  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - feedback-network

  pgadmin:
    image: dpage/pgadmin4:9.11.0
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
      PGADMIN_CONFIG_FILE_SERVERS: '["/pgadmin4.json"]'
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./pgadmin.json:/pgadmin4.json:ro
    depends_on:
      - db
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.pgadmin.rule=Host(`${PGADMIN_HOST}`)"
      - "traefik.http.routers.pgadmin.entrypoints=web"
      - "traefik.http.services.pgadmin.loadbalancer.server.port=${PGADMIN_PORT}"
    networks:
      - feedback-network


volumes:
  pgdata:
  pgadmin_data:

networks:
  feedback-network:
    driver: bridge